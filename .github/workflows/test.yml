name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Same Ubuntu release as the maintainer's WSL, so mingw matches and the committed kdec.exe can be rebuilt
    # byte for byte (kdec-build.test.ts).
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # the engines floor
          cache: npm
      # Best effort: the Ubuntu mirror can be very slow. Without mingw, kdec-build.test.ts skips the rebuild-and-compare
      # check instead of blocking the run. The win32 variant is the one that built the committed kdec.exe.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-win32
        timeout-minutes: 5
        continue-on-error: true
      - run: npm ci
      - run: npm run build:native
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
