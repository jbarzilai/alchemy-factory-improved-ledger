name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Same Ubuntu release as the maintainer's WSL. No mingw here: its download from the runner's Ubuntu mirror took over 5 minutes in every attempt, so
    # kdec-build.test.ts skips its rebuild-and-compare check (run it locally after changing the native source).
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # the engines floor
          cache: npm
      - run: npm ci
      - run: npm run build:native
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
